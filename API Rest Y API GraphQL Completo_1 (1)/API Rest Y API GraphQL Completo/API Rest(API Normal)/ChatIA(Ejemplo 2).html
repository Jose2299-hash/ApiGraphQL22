<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IA Multifuente con APIs Públicas</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f3; padding: 20px; }
    #chatbox {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    #messages {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #ccc;
    }
    .message { margin-bottom: 10px; }
    .user { font-weight: bold; color: #111; }
    .bot { color: #0077cc; }
    textarea {
      width: 100%;
      height: 60px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      float: right;
      padding: 10px 15px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div id="chatbox">
  <h2>🤖 Chatbot Multifuente con APIs Públicas</h2>
  <div id="messages"></div>
  <textarea id="user-input" placeholder="Escribe tu pregunta en cualquier forma..."></textarea><br>
  <button onclick="sendMessage()">Enviar</button>
</div>

<script>
  const messagesDiv = document.getElementById("messages");

  function appendMessage(sender, text, className) {
    const div = document.createElement("div");
    div.className = `message ${className}`;
    div.innerHTML = `<span class="${sender}">${sender === 'user' ? 'Tú' : 'Bot'}:</span> ${text}`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const query = input.value.trim();
    if (!query) return;

    appendMessage('user', query, 'user');
    input.value = "";
    appendMessage('bot', '⏳ Buscando información...', 'bot');

    const term = encodeURIComponent(query);

    try {
      // Buscar en Wikipedia
      const wikiSearch = await fetch(`https://es.wikipedia.org/w/rest.php/v1/search/title?q=${term}&limit=1`);
      const wikiData = await wikiSearch.json();

      messagesDiv.lastChild.remove(); // borra el "Buscando..."

      if (wikiData.pages && wikiData.pages.length > 0) {
        const title = wikiData.pages[0].title;
        const summaryRes = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        const summaryData = await summaryRes.json();

        if (summaryData.extract) {
          appendMessage('bot', `<strong>${summaryData.title}</strong><br>${summaryData.extract}`, 'bot');
          return;
        }
      }

      // Wiktionary (inglés)
      const dictRes = await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${term}`);
      if (dictRes.ok) {
        const dictData = await dictRes.json();
        const langs = Object.keys(dictData);
        if (langs.length > 0) {
          const entry = dictData[langs[0]][0];
          appendMessage('bot', `<strong>Definición de ${term}</strong>: ${entry.definition}`, 'bot');
          return;
        }
      }

      // PubMed
      const pubmedRes = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${term}&retmax=1&retmode=json`);
      const pubmedJson = await pubmedRes.json();

      if (pubmedJson.esearchresult.idlist.length > 0) {
        const id = pubmedJson.esearchresult.idlist[0];
        const summary = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${id}&retmode=json`);
        const sumJson = await summary.json();
        const article = sumJson.result[id];
        appendMessage('bot', `<strong>${article.title}</strong><br>Fuente: PubMed`, 'bot');
        return;
      }

      // Si no se encontró nada en las fuentes anteriores → Google Links
      const googleLink = `https://www.google.com/search?q=${term}`;
      const pages = [];
      for (let i = 0; i < 5; i++) {
        const start = i * 10;
        const pageUrl = `https://www.google.com/search?q=${term}&start=${start}`;
        pages.push(`<a href="${pageUrl}" target="_blank">🔎 Página ${i + 1}</a>`);
      }

      appendMessage('bot',
        `❌ No se encontró información en Wikipedia, Wiktionary ni PubMed.<br><br>` +
        `Puedes buscar manualmente en Google aquí:<br>` +
        `<a href="${googleLink}" target="_blank"><strong>🔍 Ver búsqueda en Google</strong></a><br><br>` +
        `<strong>Páginas relacionadas:</strong><br>` +
        pages.join("<br>"),
        'bot'
      );

    } catch (error) {
      console.error("Error:", error);
      messagesDiv.lastChild.remove();
      appendMessage('bot', '❌ Hubo un error al buscar la información.', 'bot');
    }
  }
</script>


</body>
</html>
