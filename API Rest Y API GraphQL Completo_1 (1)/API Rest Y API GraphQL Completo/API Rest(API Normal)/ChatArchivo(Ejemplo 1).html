<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Analizador Gramatical con LanguageTool</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; }
  textarea { width: 100%; height: 150px; font-size: 1rem; padding: 10px; }
  button { padding: 10px 20px; font-size: 1rem; margin-top: 10px; cursor: pointer; }
  .error { color: #b00020; }
  .match { background: #ffcccc; padding: 5px; margin: 5px 0; border-radius: 4px; }
</style>
</head>
<body>

<h2>Analizador Gramatical y Ortográfico</h2>
<textarea id="texto" placeholder="Escribe o pega el texto aquí..."></textarea><br/>
<button onclick="analizar()">Analizar</button>

<div id="resultados"></div>

<script>
async function analizar() {
  const texto = document.getElementById('texto').value.trim();
  const resultados = document.getElementById('resultados');
  resultados.innerHTML = '';

  if (!texto) {
    resultados.innerHTML = '<p class="error">Por favor, escribe algún texto para analizar.</p>';
    return;
  }

  // Preparar datos para LanguageTool API pública
  const data = new URLSearchParams();
  data.append('text', texto);
  data.append('language', 'es');

  resultados.innerHTML = '<p>Analizando...</p>';

  try {
    const response = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: data.toString()
    });
    const json = await response.json();

    if (json.matches.length === 0) {
      resultados.innerHTML = '<p>✔️ No se encontraron errores gramaticales ni ortográficos.</p>';
    } else {
      resultados.innerHTML = `<p>Se encontraron ${json.matches.length} error(es):</p>`;
      json.matches.forEach(match => {
        const fragment = texto.substring(match.offset, match.offset + match.length);
        const suggestions = match.replacements.map(r => r.value).join(', ') || 'Sin sugerencias';
        resultados.innerHTML += `
          <div class="match">
            <b>Error:</b> ${match.message}<br/>
            <b>Texto:</b> "${fragment}"<br/>
            <b>Sugerencias:</b> ${suggestions}
          </div>
        `;
      });
    }
  } catch (error) {
    resultados.innerHTML = '<p class="error">Error al conectar con el servicio de análisis. Intenta más tarde.</p>';
  }
}
</script>

</body>
</html>
