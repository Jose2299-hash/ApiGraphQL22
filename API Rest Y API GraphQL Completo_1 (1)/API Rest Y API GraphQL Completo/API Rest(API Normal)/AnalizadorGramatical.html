<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Análisis Morfosintáctico y Ortográfico</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; }
    textarea { width: 100%; height: 150px; font-size: 1rem; padding: 10px; }
    button { padding: 10px 20px; font-size: 1rem; margin-top: 10px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    .errores { color: red; margin-top: 20px; }
  </style>
</head>
<body>

<h2>Análisis Morfosintáctico (Stanza) + Ortográfico (LanguageTool)</h2>

<textarea id="texto" placeholder="Escribe o pega el texto aquí..."></textarea><br/>
<button onclick="analizar()">Analizar</button>

<h3>Errores Ortográficos y Gramaticales (LanguageTool):</h3>
<ul id="errores" class="errores"></ul>

<table id="resultadoTabla" style="display:none;">
  <thead>
    <tr>
      <th>Texto</th>
      <th>POS (Parte del discurso)</th>
      <th>Lema</th>
      <th>Características</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function analizar() {
  const texto = document.getElementById('texto').value.trim();
  const tabla = document.getElementById('resultadoTabla');
  const tbody = tabla.querySelector('tbody');
  const erroresUL = document.getElementById('errores');
  tabla.style.display = "none";
  tbody.innerHTML = "";
  erroresUL.innerHTML = "";

  if (!texto) {
    alert("Por favor, escribe algún texto para analizar.");
    return;
  }

  try {
    // Llamada a tu backend con Stanza
    const resStanza = await fetch('http://127.0.0.1:8000/analizar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto })
    });

    if (!resStanza.ok) throw new Error("Error al contactar el backend");

    const data = await resStanza.json();

    data.analisis.forEach(palabra => {
      const fila = document.createElement('tr');
      fila.innerHTML = `
        <td>${palabra.texto}</td>
        <td>${palabra.pos}</td>
        <td>${palabra.lemma}</td>
        <td>${palabra.caracteristicas}</td>
      `;
      tbody.appendChild(fila);
    });

    if (data.analisis.length > 0) {
      tabla.style.display = "table";
    }

    // Llamada a LanguageTool
    const resLT = await fetch('https://api.languagetoolplus.com/v2/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        text: texto,
        language: 'es',
      })
    });

    if (!resLT.ok) throw new Error("Error al contactar LanguageTool");

    const errores = await resLT.json();

    if (errores.matches.length === 0) {
      const li = document.createElement('li');
      li.textContent = "✅ Sin errores detectados.";
      erroresUL.appendChild(li);
    } else {
      errores.matches.forEach(error => {
        const li = document.createElement('li');
        li.innerHTML = `🔴 <strong>${error.message}</strong> – <em>${error.context.text}</em>`;
        erroresUL.appendChild(li);
      });
    }

  } catch (error) {
    alert("Error: " + error.message);
  }
}
</script>

</body>
</html>
